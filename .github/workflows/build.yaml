name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.1

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Check for linting errors
        run: bun run lint

      - name: Check for formatting errors
        run: bun run format

      - name: Check for type errors
        run: bun run check
